<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://duosolucoesam.com.br/duostat/">
<title>Teste grátis de 30 dias do DUOSTAT</title>
<noscript><meta http-equiv="refresh" content="0; url=/duostat/#teste"></noscript>
<script>
(function () {
  const trial = new URL('/duostat/', location.origin);
  const rep = new URLSearchParams(location.search).get('rep');
  if (rep && /^[a-z0-9]{1,32}$/i.test(rep)) trial.searchParams.set('rep', rep);
  trial.hash = 'teste';
  location.replace(trial.href);
})();
</script>
</head>
<body>
<main>
<h1>Teste grátis do DUOSTAT por 30 dias</h1>
<p><a href="/duostat/#teste">Peça a licença de teste e o instalador para Windows.</a></p>
</main>
</body>
</html>
