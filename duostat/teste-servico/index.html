<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste interno do serviço — DUOSTAT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/favicon.png">
<style>
body{margin:0;font:17px/1.6 "Source Sans 3",system-ui,sans-serif;color:#1A2530;background:#F4F6F9}
main{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font:800 26px/1.2 Montserrat,system-ui,sans-serif;color:#0B2A4A;margin:0 0 8px}
p{margin:0 0 16px;color:#4A5560}
form,.estado{display:flex;flex-direction:column;gap:14px;background:#fff;border-radius:10px;padding:24px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0B2A4A}
input,select{font:inherit;font-weight:400;padding:12px 14px;border:1px solid #B9C3CE;border-radius:6px;min-height:44px;box-sizing:border-box}
.aceite{flex-direction:row;gap:10px;align-items:flex-start;font-weight:400;color:#26323E}
.aceite input{min-height:0;width:18px;height:18px;margin-top:4px}
button{font:inherit;font-weight:600;background:#F2622D;color:#fff;border:0;border-radius:6px;padding:14px 20px;min-height:48px;cursor:pointer}
button:disabled{opacity:.6}
[aria-invalid]{border-color:#B42318}
#aviso{min-height:1.4em;margin:0}
#aviso.erro{color:#B42318}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Teste interno do serviço de teste grátis</h1>
<p>Página temporária da DUO para conferir o serviço. Ela sai do ar logo depois do teste.</p>

<form id="f" novalidate>
<label>Seu nome<input name="nome" required maxlength="80" autocomplete="name"></label>
<label>Cargo<input name="cargo" required maxlength="80" autocomplete="organization-title"></label>
<label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<label>Empresa<input name="empresa" required maxlength="120" autocomplete="organization"></label>
<label>Estudo de maior interesse<select name="estudo" required>
<option value="">Escolha um estudo</option>
<option>Capacidade</option><option>Carta X̄-R</option><option>GR&amp;R</option>
<option>Linearidade</option><option>Estabilidade</option><option>Tendência</option><option>Ainda não sei</option>
</select></label>
<label class="aceite"><input type="checkbox" name="aceite" required><span>Li e aceito a <a href="/privacidade/" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>
<div id="ts"></div>
<button type="submit" id="enviar">Pedir chave de teste</button>
<p id="aviso" role="status" aria-live="polite"></p>
</form>

<div class="estado" id="confirme" hidden tabindex="-1">
<h1>Confira sua caixa de entrada.</h1>
<p>Enviamos o link de confirmação para <b id="email-enviado"></b>. Ele vale por duas horas.</p>
</div>
</main>

<script>
/* Página temporária do passo 7.1: chama o serviço publicado, com Turnstile. Não tem link em nenhuma outra página. */
(function(){
  const API = "https://api.duosolucoesam.com.br", SITEKEY = "0x4AAAAAAFVwOYTkfoq-IlZO", POLITICA = "2026-10-10";
  const f = document.getElementById("f"), aviso = document.getElementById("aviso"), botao = document.getElementById("enviar");
  const avisar = (t, erro)=>{ aviso.textContent = t; aviso.className = erro ? "erro" : ""; };
  const marcar = nome=>{ f.querySelectorAll("[aria-invalid]").forEach(c=>c.removeAttribute("aria-invalid")); const c = nome && f.elements[nome]; if (c){ c.setAttribute("aria-invalid","true"); c.focus(); } };

  let widget = null;
  window.duostatTurnstile = ()=>{ widget = turnstile.render("#ts", {sitekey: SITEKEY, language: "pt-br"}); };
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=duostatTurnstile";
  s.async = true; s.defer = true; document.head.appendChild(s);

  f.addEventListener("submit", async e=>{
    e.preventDefault();
    const invalido = [...f.elements].find(c=>c.willValidate && !c.checkValidity());
    if (invalido){ marcar(invalido.name); avisar("Confira o campo destacado.", true); return; }
    const token = widget !== null && window.turnstile ? turnstile.getResponse(widget) : "";
    if (!token){ avisar("Aguarde a verificação de segurança terminar e envie de novo.", true); return; }
    botao.disabled = true; avisar("Enviando…");
    const corpo = {
      nome: f.elements.nome.value, email: f.elements.email.value, empresa: f.elements.empresa.value, cargo: f.elements.cargo.value,
      estudo: f.elements.estudo.value, aceite: f.elements.aceite.checked, politica_versao: POLITICA,
      rep: "", origem: location.pathname, idioma: "pt-BR", turnstile: token
    };
    try{
      const r = await fetch(API + "/api/trial", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)});
      const j = await r.json().catch(()=>({}));
      if (r.status === 202){
        document.getElementById("email-enviado").textContent = corpo.email.trim().toLowerCase();
        f.hidden = true; const c = document.getElementById("confirme"); c.hidden = false; c.focus();
      } else { marcar(j.campo); avisar(j.mensagem || "Não foi possível enviar agora (HTTP " + r.status + ").", true); }
    }catch(err){ avisar("Sem conexão com o serviço.", true); }
    finally{ botao.disabled = false; if (widget !== null && window.turnstile) turnstile.reset(widget); }
  });
})();
</script>
</body>
</html>
